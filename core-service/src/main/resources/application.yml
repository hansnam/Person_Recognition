server:
  port: 8080
  tomcat:
    max-swallow-size: -1
    max-http-form-post-size: -1
    connection-timeout: 300000

spring:
  application:
    name: core-service

  datasource:
    url: jdbc:mysql://localhost:3306/face?useSSL=false&createDatabaseIfNotExist=true&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
    username: root
    password: '123456'
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
    open-in-view: false

  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 500MB

  mail:
    host: ${SPRING_MAIL_HOST:localhost}
    port: ${SPRING_MAIL_PORT:1025}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

# Cấu hình tích hợp ML Service (FastAPI)
ml-service:
  base-url: http://127.0.0.1:8000
  similarity-threshold: 0.45

# Cấu hình lưu trữ ảnh, Email cảnh báo & JWT
app:
  upload:
    dir: ./uploads
  mail:
    enabled: ${APP_MAIL_ENABLED:true}
    from: ${APP_MAIL_FROM:noreply@timnguoimattich.vn}
    app-base-url: ${APP_BASE_URL:http://localhost:8080}
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration-ms: 86400000
